name: Update forecast

on:
  schedule:
    - cron: "0 4,13 * * *"   # ~9pm and ~6am Vancouver (UTC times; GitHub may run a few minutes late)
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Stop after the trip
        id: guard
        run: |
          if [ "$(TZ=America/Vancouver date +%F)" \> "2026-11-10" ]; then
            echo "Trip is over; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Refresh forecast.json
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 -I update.py forecast.json "$RUNNER_TEMP/out.json" "$RUNNER_TEMP/msg.json" https://cabo-forecast.netlify.app
          cp "$RUNNER_TEMP/out.json" forecast.json

      - name: Commit and push if changed
        if: steps.guard.outputs.skip != 'true'
        run: |
          if git diff --quiet forecast.json; then
            echo "No change."; exit 0
          fi
          git config user.name "Forecast Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Forecast update $(date -u +%Y-%m-%dT%H:%M:%SZ)" -- forecast.json
          git push
